services:
  - type: worker
    name: goowac-mc-monitor
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: SCAN_INTERVAL_SECONDS
        value: "300"
      - key: PING_TIMEOUT_SECONDS
        value: "5"
      - key: LOG_LEVEL
        value: INFO
